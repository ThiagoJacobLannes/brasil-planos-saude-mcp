[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brasil-planos-saude-mcp"
version = "0.1.0"
description = "MCP server to compare Brazilian health-plan operators with ANS open data: complaints (IGR), quality (IDSS), fines and readjustments (read-only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
    "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://github.com/ThiagoJacobLannes/brasil-planos-saude-mcp"

[project.scripts]
brasil-planos-saude-mcp = "brasil_planos_saude_mcp.server:main"

[tool.setuptools]
packages = ["brasil_planos_saude_mcp"]
